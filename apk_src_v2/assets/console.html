<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Botagent</title>
<style>
  :root{
    --bg:#08181b; --bg2:#0b2124; --card:#0f262a; --line:#1b3c42;
    --txt:#e8fbf9; --dim:#7fa8ad; --cyan:#22d3c5; --cyan2:#14b8a6;
    --green:#34d399; --amber:#fbbf24; --red:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100%}

  header{display:flex;align-items:center;gap:10px;padding:12px 14px;
    background:linear-gradient(180deg,#0b2226,#08181b);border-bottom:1px solid var(--line);
    position:relative}
  .back{font-size:20px;color:var(--dim);padding:4px 8px}
  .who{flex:1}
  .name{font-weight:700;font-size:15px}
  .state{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%;background:#4b6b70}
  .dot.on{background:var(--green);box-shadow:0 0 8px #34d399aa}
  .dot.off{background:var(--red)}
  .dot.warn{background:var(--amber)}
  .iconbtn{background:transparent;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:7px 11px;font-size:12.5px}

  #list{flex:1;overflow-y:auto;padding:14px 14px 6px;-webkit-overflow-scrolling:touch}
  .msg{max-width:86%;padding:11px 13px;border-radius:14px;margin-bottom:10px;
    font-size:14.5px;white-space:pre-wrap;word-break:break-word;animation:pop .18s ease}
  .me{margin-left:auto;background:linear-gradient(135deg,#14b8a6,#0e9f8f);color:#04211f;
    border-bottom-right-radius:5px}
  .ai{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .tool{font-size:11.5px;color:var(--cyan);background:#0c2b2f;border:1px dashed #1f5359;
    border-radius:9px;padding:6px 9px;margin-bottom:8px;max-width:86%;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .typing{display:inline-flex;gap:3px;align-items:center;height:14px}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--cyan);opacity:.5;
    animation:blink 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

  .qrbox{display:none;padding:14px;text-align:center}
  .qrbox img{width:220px;height:220px;background:#fff;border-radius:12px;padding:8px}
  .qrbox p{color:var(--dim);font-size:12.5px;margin:10px 0 0}

  footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:#071619;display:flex;gap:8px}
  textarea{flex:1;resize:none;height:44px;max-height:110px;background:#0d2428;
    border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px 13px;
    font:15px/1.4 inherit;outline:none}
  textarea:focus{border-color:var(--cyan)}
  #send{width:64px;border:0;border-radius:12px;font-weight:700;color:#04211f;
    background:linear-gradient(135deg,#2ee6d6,#12b3a2);transition:transform .1s}
  #send:active{transform:scale(.96)}
  #send:disabled{opacity:.4}

  /* 状态页 */
  #panel{display:none;flex:1;overflow-y:auto;padding:16px}
  .row{display:flex;justify-content:space-between;padding:11px 0;
    border-bottom:1px solid #122c30;font-size:13.5px}
  .row span:first-child{color:var(--dim)}
  .tabs{display:flex;gap:0;border-top:1px solid var(--line);background:#071619}
  .tab{flex:1;text-align:center;padding:10px 0;font-size:12.5px;color:var(--dim)}
  .tab.on{color:var(--cyan)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="back" id="back">‹</div>
    <div class="who">
      <div class="name" id="who">Botagent</div>
      <div class="state"><span class="dot" id="dot"></span><span id="state">连接中…</span></div>
    </div>
    <button class="iconbtn" id="qrbtn">扫码</button>
  </header>

  <div id="list"></div>
  <div id="panel"></div>
  <div class="qrbox" id="qrbox">
    <img id="qrimg" alt="二维码">
    <p>用要当机器人的 QQ 扫这张码</p>
  </div>

  <footer id="composer">
    <textarea id="input" placeholder="发指令…" rows="1"></textarea>
    <button id="send">发送</button>
  </footer>

  <div class="tabs">
    <div class="tab on" id="tab-chat">对话</div>
    <div class="tab" id="tab-status">状态</div>
    <div class="tab" id="tab-qr">扫码</div>
  </div>
</div>

<script>
const B = (typeof Android !== "undefined") ? Android : null;
let PORT = 8080;
try { if (B && B.runPort) PORT = B.runPort() || 8080; } catch (e) {}
const API = "http://127.0.0.1:" + PORT;

const $ = (id) => document.getElementById(id);
const list = $("list");

function addMsg(text, mine){
  const d = document.createElement("div");
  d.className = "msg " + (mine ? "me" : "ai");
  d.textContent = text;
  list.appendChild(d);
  list.scrollTop = list.scrollHeight;
  return d;
}
function addTool(name, args){
  const d = document.createElement("div");
  d.className = "tool";
  d.textContent = "🔧 " + name + (args ? "  " + args : "");
  list.appendChild(d);
  list.scrollTop = list.scrollHeight;
}
function typing(){
  const d = document.createElement("div");
  d.className = "msg ai";
  d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  list.appendChild(d);
  list.scrollTop = list.scrollHeight;
  return d;
}

async function refresh(){
  try{
    const r = await fetch(API + "/api/qq", {cache:"no-store"});
    const d = await r.json();
    const on = d.online === true;
    $("dot").className = "dot " + (on ? "on" : (d.bot ? "warn" : "off"));
    $("state").textContent = on ? "QQ 在线" : (d.bot ? "等待扫码" : "协议端未连");
  }catch(e){
    $("dot").className = "dot off";
    $("state").textContent = "服务未启动";
  }
}

async function send(){
  const el = $("input");
  const text = (el.value || "").trim();
  if (!text) return;
  el.value = "";
  el.style.height = "44px";
  addMsg(text, true);
  $("send").disabled = true;
  const t = typing();
  let first = true;
  let acc = "";
  try{
    const res = await fetch(API + "/api/stream", {
      method: "POST",
      headers: {"Content-Type": "text/plain; charset=utf-8"},
      body: text
    });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0){
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let ev = "message", data = "";
        raw.split("\n").forEach(line => {
          if (line.startsWith("event:")) ev = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        });
        if (!data) continue;
        let obj = null;
        try { obj = JSON.parse(data); } catch(e) { continue; }
        if (ev === "text"){
          if (first){ t.remove(); first = false; }
          acc += (obj.t || "");
          if (!acc.el){
            acc.el = addMsg(acc);
          } else {
            acc.el.textContent = acc;
          }
        } else if (ev === "tool"){
          if (first){ t.remove(); first = false; }
          addTool(obj.name || "", obj.args || "");
        }
      }
    }
  }catch(e){
    if (first) t.remove();
    addMsg("（出错了：" + e.message + "）", false);
  }
  $("send").disabled = false;
  refresh();
}

$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("input").addEventListener("input", () => {
  const el = $("input");
  el.style.height = "44px";
  el.style.height = Math.min(110, el.scrollHeight) + "px";
});
$("back").onclick = () => { try{ if (B && B.reload) B.reload(); }catch(e){} };

$("qrbtn").onclick = () => showTab("qr");
$("tab-chat").onclick = () => showTab("chat");
$("tab-status").onclick = () => showTab("status");
$("tab-qr").onclick = () => showTab("qr");

function showTab(which){
  ["chat","status","qr"].forEach(k => {
    $("tab-" + k).classList.toggle("on", k === which);
  });
  $("list").style.display = which === "chat" ? "block" : "none";
  $("panel").style.display = which === "status" ? "block" : "none";
  $("qrbox").style.display = which === "qr" ? "block" : "none";
  $("composer").style.display = which === "chat" ? "flex" : "none";
  if (which === "qr") loadQr();
  if (which === "status") loadStatus();
}

function loadQr(){
  const img = $("qrimg");
  img.src = API + "/api/qr.png?t=" + Date.now();
}

async function loadStatus(){
  const p = $("panel");
  p.innerHTML = "读取中…";
  try{
    const r = await fetch(API + "/api/qq", {cache:"no-store"});
    const d = await r.json();
    const rows = [
      ["服务", d.bot ? "运行中" : "未运行"],
      ["QQ", d.online === true ? "在线" : "未登录"],
      ["协议端", d.proot ? "已连接" : "未连接"],
      ["端口", PORT],
      ["模式", d.mode || "normal"],
    ];
    p.innerHTML = rows.map(r =>
      `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
  }catch(e){
    p.innerHTML = '<div class="row"><span>状态</span><span>读不到（服务没起）</span></div>';
  }
}

refresh();
setInterval(refresh, 6000);
setTimeout(() => {
  if (!list.children.length){
    addMsg("我是 Botagent。可以让我查电量、开 App、搜东西、定提醒。\n先让我启动服务，再跟我说话。");
  }
}, 300);
</script>
</body>
</html>
