name: build-apk

# 打 tag（v*）或手动触发时，构建 APK 并挂到 Release。
#
# 说明：
#   APK 需要两坨二进制资源，它们不进 git（体积大）：
#     · apk_src_v2/assets/runtime.zip          Python 运行时（约 16.6 MB）
#     · apk_src_v2/napcat_assets/NapCat.Shell.zip   NapCat 官方包（约 34 MB）
#   所以本流程会先去「最新 Release 的资产」里下载这两个文件；
#   下载不到就直接失败并提示怎么补。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 装 Android build-tools 34 + platform 34
        uses: android-actions/setup-android@v3

      - name: 补 build-tools / platform
        shell: pwsh
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 下载二进制资源（runtime.zip / NapCat.Shell.zip）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rel = gh api repos/${{ github.repository }}/releases/latest | ConvertFrom-Json
          $want = @{
            "runtime.zip"        = "apk_src_v2/assets/runtime.zip"
            "NapCat.Shell.zip"   = "apk_src_v2/napcat_assets/NapCat.Shell.zip"
          }
          $have = 0
          foreach ($a in $rel.assets) {
            if ($want.ContainsKey($a.name)) {
              $dst = $want[$a.name]
              New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
              Write-Host "下载 $($a.name) -> $dst"
              gh release download $rel.tag_name --repo ${{ github.repository }} `
                 --pattern $a.name --output $dst --clobber
              $have++
            }
          }
          if ($have -lt 2) {
            Write-Host "::error::最新 Release 里缺少 runtime.zip 或 NapCat.Shell.zip。"
            Write-Host "把这些文件作为 Release 资产上传一次，后续构建就能自动跑。"
            exit 1
          }

      - name: 构建 APK
        shell: pwsh
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Out .\Botagent-ci.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Botagent-apk
          path: Botagent-ci.apk
          retention-days: 14

      - name: 挂到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} .\Botagent-ci.apk `
             --repo ${{ github.repository }} --clobber
