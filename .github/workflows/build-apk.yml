name: build-apk

# 打 tag（v*）或手动触发时，构建 APK 并挂到 Release。
#
# 说明：
#   APK 需要两坨二进制资源，它们不进 git（体积大）：
#     · apk_src_v2/assets/runtime.zip               Python 运行时（约 16.6 MB）
#     · apk_src_v2/napcat_assets/NapCat.Shell.zip   NapCat 官方包（约 34 MB）
#   本流程从「最新 Release 的资产」下载这两个文件；下载不到就直接失败并提示。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 装 Android SDK（cmdline-tools + platform 34 + build-tools 34）
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "android-sdk"
          New-Item -ItemType Directory -Force $sdk | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "clt.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "clt") -Force
          $bin = Join-Path $sdk "cmdline-tools\latest"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "clt\cmdline-tools\*") $bin -Recurse -Force
          $sdm = Join-Path $bin "bin\sdkmanager.bat"
          Write-Host "sdkmanager: $sdm"

          # 关键：许可证要回答很多次 yes，只 echo 一次是不够的
          $yes = Join-Path $env:RUNNER_TEMP "yes.txt"
          1..80 | ForEach-Object { "y" } | Set-Content -Path $yes -Encoding ascii
          cmd /c "`"$sdm`" --sdk_root=`"$sdk`" --licenses < `"$yes`"" | Out-Host

          cmd /c "`"$sdm`" --sdk_root=`"$sdk`" `"platforms;android-34`" `"build-tools;34.0.0`"" | Out-Host

          if (-not (Test-Path (Join-Path $sdk "build-tools\34.0.0"))) {
            Write-Host "::error::build-tools 34 没装上"
            exit 1
          }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_HOME=$sdk"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem (Join-Path $sdk "build-tools") | Select-Object Name

      - name: 下载二进制资源（runtime.zip / NapCat.Shell.zip）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 注意：我们的 release 标了 prerelease，/releases/latest 会跳过它，
          # 所以这里取「最近的一个 release」（按发布时间倒序的第一条）。
          $rels = gh api "repos/${{ github.repository }}/releases?per_page=10" | ConvertFrom-Json
          if (-not $rels -or $rels.Count -eq 0) {
            Write-Host "::error::仓库里还没有任何 Release"
            exit 1
          }
          $tag = $rels[0].tag_name
          $names = $rels[0].assets | ForEach-Object { $_.name }
          Write-Host "使用 Release: $tag  资产: $($names -join ', ')"

          $want = @{
            "runtime.zip"      = "apk_src_v2/assets/runtime.zip"
            "NapCat.Shell.zip" = "apk_src_v2/napcat_assets/NapCat.Shell.zip"
          }
          $have = 0
          foreach ($k in $want.Keys) {
            if ($names -contains $k) {
              $dst = $want[$k]
              New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
              gh release download $tag --repo ${{ github.repository }} --pattern $k --output $dst --clobber
              $mb = [math]::Round((Get-Item $dst).Length / 1MB, 1)
              Write-Host "已下载 $k -> $dst ($mb MB)"
              $have++
            } else {
              Write-Host "::warning::Release $tag 里没有 $k"
            }
          }
          if ($have -lt 2) {
            Write-Host "::error::缺少 runtime.zip 或 NapCat.Shell.zip，无法构建"
            exit 1
          }

      - name: 注入机器人代码
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apk_src_v2/aibot_assets | Out-Null
          Copy-Item aibot/*.py apk_src_v2/aibot_assets/ -Force
          Get-ChildItem apk_src_v2/aibot_assets | Select-Object Name

      - name: 构建 APK
        shell: pwsh
        run: |
          Push-Location apk_src_v2
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Out "$env:GITHUB_WORKSPACE\Botagent-ci.apk"
          Pop-Location
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\Botagent-ci.apk")) { throw "没有产出 APK" }
          Get-Item "$env:GITHUB_WORKSPACE\Botagent-ci.apk" | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Botagent-apk
          path: Botagent-ci.apk
          retention-days: 14

      - name: 挂到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} .\Botagent-ci.apk --repo ${{ github.repository }} --clobber
